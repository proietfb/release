ref:
  as: mco-compute-shard-balanced
  from: tests
  command: mco-compute-shard-balanced-commands.sh
  timeout: 300s
  env:
    - name: TEST_SUITE
      default: openshift/conformace/parallel
    - name: SIPPY_RELEASE
      default: ""
    - name: SHARD_ARGS
      default: ""
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Computes a balanced test-to-shard assignment using historical
    durations from Sippy and the ...(balancing) algorithm. Writes per-shard
    test lists to SHARED_DIR for use by mco-e2e-test-balanced.

